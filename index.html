    // ═══════════════════════════════════════════

    // ═══════════════════════════════════════════
    //  3. 永続化 (localStorage) & マイグレーション
    // ═══════════════════════════════════════════
    function saveData() {
        localStorage.setItem('evac_groups', JSON.stringify(shelterGroups));
        localStorage.setItem('evac_lots', JSON.stringify(supplyLots));
        localStorage.setItem('evac_requests', JSON.stringify(requests));
        localStorage.setItem('evac_custom', JSON.stringify(customItems));
    }

    function loadData() {
        try {
            const sg = localStorage.getItem('evac_groups');
            if (sg) shelterGroups = JSON.parse(sg);
            const sl = localStorage.getItem('evac_lots');
            if (sl) supplyLots = JSON.parse(sl);
            const req = localStorage.getItem('evac_requests');
            if (req) requests = JSON.parse(req);
            const ci = localStorage.getItem('evac_custom');
            if (ci) customItems = JSON.parse(ci);

            // マイグレーション
            Object.keys(shelterGroups).forEach(sid => {
                shelterGroups[sid] = shelterGroups[sid].map(g => {
                    if (g.members) return g; // 既に移行済み
                    const members = [];
                    let mId = 1;
                    const addM = (count, type, prefix) => {
                        for(let i=0; i<count; i++) {
                            const needs = {};
                            if (type === 'infant' && g.infantNeeds) {
                                if (g.infantNeeds.formula) needs.formula = true;
                                if (g.infantNeeds.liquidMilk) needs.liquidMilk = true;
                                if (g.infantNeeds.diaper) { needs.diaper = true; needs.diaperOption = g.infantNeeds.diaperSize || 'M'; }
                                if (g.infantNeeds.babyFood) needs.babyFood = true;
                                if (g.infantNeeds.babyWipes) needs.babyWipes = true;
                            }
                            members.push({
                                id: 'm_' + uid() + (mId++),
                                type: type,
                                name: prefix + (i+1),
                                needs: needs,
                                requestItems: {}, // needId -> requestId
                                specialNotes: (i===0 && g.specialNotes) ? g.specialNotes : ''
                            });
                        }
                    };
                    addM(g.infants || 0, 'infant', '乳幼児');
                    addM(g.children || 0, 'child', '子供');
                    addM(g.adults || 0, 'adult', '大人');
                    addM(g.elderly || 0, 'elderly', '高齢者');
                    return { id: g.id, registeredAt: g.registeredAt || new Date().toISOString(), members };
                });
            });
            saveData(); 
        } catch(e) { console.error('Data load error:', e); }

    // ═══════════════════════════════════════════
    //  4. ヘルパー関数
    // ═══════════════════════════════════════════
    function getAllCategories() {
        return baseCategories.map(cat => ({
            ...cat,
            items: [...cat.items, ...customItems.filter(c => c.categoryId === cat.id)]
        }));
    }

    function getItemById(id) {
        for (const cat of getAllCategories()) {
            const item = cat.items.find(i => i.id === id);
            if (item) return item;
        }
        return { id, name: '不明な物資', unit: '個', emoji: '📦', perDay: 0 };
    }

    function getShelterPopulation(shelterId) {
        const groups = shelterGroups[shelterId] || [];
        let res = { total: 0, infants: 0, children: 0, adults: 0, elderly: 0, groupCount: groups.length };
        groups.forEach(g => {
            (g.members || []).forEach(m => {
                res.total++;
                if (m.type === 'infant') res.infants++;
                else if (m.type === 'child') res.children++;
                else if (m.type === 'adult') res.adults++;
                else if (m.type === 'elderly') res.elderly++;
            });
        });
        return res;
    }

    function calcRemainingDays(shelterId, itemId) {
        const item = getItemById(itemId);
        const pop = getShelterPopulation(shelterId);
        let targetPop = 0;
        if (item.target === 'all') targetPop = pop.total || shelters.find(s=>s.id===shelterId).evacuees;
        else if (item.target === 'infant') targetPop = pop.infants;
        else if (item.target === 'child') targetPop = pop.children;
        else if (item.target === 'adult') targetPop = pop.adults;
        else if (item.target === 'elderly') targetPop = pop.elderly;

        if (targetPop === 0) return 999;
        const perDay = item.perDay || 1;
        const totalServings = getValidServings(shelterId, itemId);
        return totalServings / (targetPop * perDay);
    }

    function calcGroupCalories(group) {
        if (!group || !group.members) return 0;
        return group.members.reduce((sum, m) => sum + (calorieTable[m.type] || 0), 0);
    }

    function calcGroupWater(group) {
        if (!group || !group.members) return 0;
        return group.members.reduce((sum, m) => sum + (waterTable[m.type] || 0), 0);
    }

    function getTotalServings(shelterId, itemId) {
        const lots = (supplyLots[shelterId] && supplyLots[shelterId][itemId]) || [];
        return lots.reduce((sum, l) => sum + (l.servingsPerUnit * l.quantity), 0);
    }

    function getValidServings(shelterId, itemId) {
        const lots = (supplyLots[shelterId] && supplyLots[shelterId][itemId]) || [];
        const today = new Date().toISOString().split('T')[0];
        return lots.filter(l => !l.expirationDate || l.expirationDate >= today).reduce((sum, l) => sum + (l.servingsPerUnit * l.quantity), 0);
    }

    function getNearbySurplus(myShelterId, itemId) {
        const results = [];
        shelters.forEach(s => {
            if (s.id === myShelterId) return;
            const days = calcRemainingDays(s.id, itemId);
            if (days >= 7 && days !== 999) {
                const item = getItemById(itemId);
                const pop = getShelterPopulation(s.id);
                let tPop = pop.total || s.evacuees;
                if (item.target !== 'all') tPop = pop[item.target+'s'] || 0;
                const excessDays = days - 5;
                if (excessDays > 0 && tPop > 0) {
                    const surplusAmount = excessDays * tPop * (item.perDay||1);
                    results.push({ shelter: s, surplusDays: excessDays, totalServings: Math.floor(surplusAmount) });
                }
            }
        });
        return results.sort((a,b)=>b.surplusDays - a.surplusDays);
    }

    function pendingRequestCount(shelterId = null) {
    return requests.filter(r =>
        (r.status === 'pending' || r.status === 'approved') &&
        (!shelterId || r.shelterId === shelterId)
    ).length;
}

    function expirationStatus(dateStr) {
        if (!dateStr) return { expired: false, days: 999, label: '期限なし', cls: 'text-gray-400' };
        const today = new Date(); today.setHours(0,0,0,0);
        const exp = new Date(dateStr); exp.setHours(0,0,0,0);
        const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return { expired: true, days: diffDays, label: `期限切れ (${Math.abs(diffDays)}日前)`, cls: 'text-red-500 font-bold' };
        if (diffDays === 0) return { expired: false, days: 0, label: '本日まで', cls: 'text-orange-500 font-bold' };
        if (diffDays <= 7) return { expired: false, days: diffDays, label: `残り${diffDays}日`, cls: 'text-amber-500 font-bold' };
        return { expired: false, days: diffDays, label: `残り${diffDays}日`, cls: 'text-emerald-600' };
    }

    function daysLabel(rd) {
        if (rd === 999) return { text: '対象外', bg: 'bg-gray-100', color: 'text-gray-400' };
        if (rd <= 3) return { text: rd.toFixed(1)+'日', bg: 'bg-red-100', color: 'text-red-700' };
        if (rd <= 7) return { text: rd.toFixed(1)+'日', bg: 'bg-yellow-100', color: 'text-yellow-700' };
        return { text: rd.toFixed(1)+'日', bg: 'bg-emerald-100', color: 'text-emerald-700' };
    }

    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);

        return Array.from(new Uint8Array(hashBuffer))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');
    }

    async function verifyAdminAuth(type) {
        if (type === 'set') {
            const newPin = document.getElementById('admin-pin-new').value;
            const confirmPin = document.getElementById('admin-pin-confirm').value;

            if (!newPin) {
                showToast('❌', 'パスワードを入力してください', 'bg-red-500');
                return;
            }

            if (newPin !== confirmPin) {
                showToast('❌', 'パスワードが一致しません', 'bg-red-500');
                return;
            }

            const passwordHash = await hashPassword(newPin);

            const { error } = await db
                .from("shelter_admins")
                .upsert({
                    shelter_id: state.selectedShelter.id,
                    password_hash: passwordHash
                });

            if (error) {
                console.error("管理者パスワード設定エラー:", error);
                showToast('❌', 'パスワード設定に失敗しました', 'bg-red-500');
                return;
            }

            showToast('✅', 'パスワードを設定しました', 'bg-emerald-600');
            setTimeout(() => navigateTo('adminDashboard'), 500);

        } else if (type === 'login') {
            const pin = document.getElementById('admin-pin').value;

            const { data, error } = await db
                .from("shelter_admins")
                .select("password_hash")
                .eq("shelter_id", state.selectedShelter.id)
                .maybeSingle();

            if (error) {
                console.error("管理者ログインエラー:", error);
                showToast('❌', 'ログイン確認に失敗しました', 'bg-red-500');
                return;
            }

            if (!data) {
                showToast('❌', 'パスワードがまだ設定されていません', 'bg-red-500');
                return;
            }

            const inputHash = await hashPassword(pin);

            if (inputHash === data.password_hash) {
                showToast('✅', '認証に成功しました', 'bg-emerald-600');
                setTimeout(() => navigateTo('adminDashboard'), 500);
            } else {
                showToast('❌', 'パスワードが間違っています', 'bg-red-500');
            }
        }
    }

    async function updateAdminPassword() {
        const oldPin = document.getElementById('setting-old-pin').value;
        const newPin = document.getElementById('setting-new-pin').value;

        if (!oldPin) {
            showToast('❌', '現在のパスワードを入力してください', 'bg-red-500');
            return;
        }

        if (!newPin) {
            showToast('❌', '新しいパスワードを入力してください', 'bg-red-500');
            return;
        }

        const { data, error } = await db
            .from("shelter_admins")
            .select("password_hash")
            .eq("shelter_id", state.selectedShelter.id)
            .maybeSingle();

        if (error) {
            console.error("現在のパスワード確認エラー:", error);
            showToast('❌', '現在のパスワード確認に失敗しました', 'bg-red-500');
            return;
        }

        if (!data) {
            showToast('❌', '管理者パスワードが未設定です', 'bg-red-500');
            return;
        }

        const oldHash = await hashPassword(oldPin);

        if (oldHash !== data.password_hash && oldPin !== data.password_hash) {
            showToast('❌', '現在のパスワードが間違っています', 'bg-red-500');
            return;
        }

        const newHash = await hashPassword(newPin);

        const { error: updateError } = await db
            .from("shelter_admins")
            .update({
                password_hash: newHash
            })
            .eq("shelter_id", state.selectedShelter.id);

        if (updateError) {
            console.error("パスワード変更エラー:", updateError);
            showToast('❌', 'パスワード変更に失敗しました', 'bg-red-500');
            return;
        }

        showToast('✅', 'パスワードを変更しました', 'bg-emerald-600');

        document.getElementById('setting-old-pin').value = '';
        document.getElementById('setting-new-pin').value = '';
    }

${r.status==='approved' ? `<button onclick="updateRequestStatus('${r.id}','done')" class="text-[9px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full btn-press-sm border border-emerald-200 touch-manipulation">対応済みにする</button>` : ''}
${(r.status==='pending' || r.status==='approved') ? `<button onclick="updateRequestStatus('${r.id}','cancelled')" class="text-[9px] font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full btn-press-sm border border-gray-200 touch-manipulation">キャンセル</button>` : ''}

    function screenAdminCalendar() {
        const today = new Date();
        if (!state.calendarMonth) {
            state.calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        }
        
        const year = state.calendarMonth.getFullYear();
        const month = state.calendarMonth.getMonth();
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        let daysHtml = '';
        for (let i = 0; i < firstDay; i++) {
            daysHtml += `<div class="p-2 text-center"></div>`;
        }
        
        const shelterReqs = requests.filter(r => r.shelterId === state.selectedShelter.id);
        const activeRequests = shelterReqs.filter(r => r.status === 'pending' || r.status === 'approved');
        
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const reqCount = activeRequests.filter(r => r.deadlineDate === dateStr).length;
            const isSelected = state.calendarSelectedDate === dateStr;
            const isToday = dateStr === today.toISOString().split('T')[0];
            
            let classes = "w-10 h-10 mx-auto rounded-full flex flex-col items-center justify-center relative btn-press-sm transition-all touch-manipulation ";
            if (isSelected) classes += "bg-indigo-600 text-white font-bold shadow-md ";
            else if (isToday) classes += "bg-indigo-100 text-indigo-700 font-bold ";
            else classes += "text-gray-700 active:bg-gray-200 ";
            
            daysHtml += `
            <div class="py-1">
                <button onclick="selectCalendarDate('${dateStr}')" class="${classes}">
                    <span class="text-sm">${i}</span>
                    ${reqCount > 0 ? `<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-red-500 border border-white"></span>` : ''}
                </button>
            </div>`;
        }
        
        let reqHtml = '';
        if (state.calendarSelectedDate) {
            const dayReqs = requests.filter(r => r.deadlineDate === state.calendarSelectedDate);
            if (dayReqs.length > 0) {
                const statusMap = {
    pending: '📤 対応待ち',
    approved: '🔄 対応中',
    done: '✅ 対応済み',
    cancelled: '🚫 キャンセル'
};

const statusColor = {
    pending: 'text-red-600 bg-red-50 border-red-200',
    approved: 'text-indigo-600 bg-indigo-50 border-indigo-200',
    done: 'text-emerald-600 bg-emerald-50 border-emerald-200',
    cancelled: 'text-gray-500 bg-gray-100 border-gray-200'
};
                
                reqHtml = dayReqs.map(r => {
                    const shelter = shelters.find(sh => sh.id === r.shelterId);
                    return `
                    <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm mb-3 fade-in">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${r.itemName}</h3>
                                <p class="text-[9px] text-gray-500">📍 ${shelter?shelter.name:'不明'} | 数量: ${r.quantity}</p>
                            </div>
                            <span class="text-[9px] font-bold px-2 py-1 rounded-full border ${statusColor[r.status]||''}">${statusMap[r.status]||r.status}</span>
                        </div>
                        <div class="mb-2 bg-gray-50 rounded-lg p-2">
                            <p class="text-[9px] font-bold text-gray-500 flex items-center gap-2">
                                対象: <span class="text-indigo-600">${r.forMemberName || 'グループ全体'}</span>
                                ${r.forMemberIds && r.forMemberIds.length > 0 ? (r.forMemberIds.length === 1 ? `<button onclick="openMemberDetail('${r.shelterId}','${r.groupId}','${r.forMemberIds[0]}')" class="text-[9px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-full btn-press-sm border border-indigo-100 touch-manipulation">👤 対象者の詳細</button>` : `<button onclick="openGroupDetail('${r.shelterId}','${r.groupId}','${r.forMemberIds.join(',')}')" class="text-[9px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-full btn-press-sm border border-indigo-100 touch-manipulation">👥 対象者 (${r.forMemberIds.length}名) の詳細</button>`) : (r.groupId ? `<button onclick="openGroupDetail('${r.shelterId}','${r.groupId}')" class="text-[9px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-full btn-press-sm border border-indigo-100 touch-manipulation">👥 グループ詳細</button>` : '')}
                            </p>
                            ${r.note ? `<p class="text-[10px] text-gray-700 bg-orange-50/50 border border-orange-100/50 p-2 rounded-lg mt-1 break-words">📝 ${r.note.replace(/\n/g, '<br>')}</p>` : ''}
                        </div>
                        <div class="flex items-center justify-between border-t border-gray-100 pt-2 mt-1">
                            <p class="text-[9px] text-gray-400">作成: ${new Date(r.createdAt).toLocaleDateString('ja-JP')}</p>
                            <div class="flex gap-2">
                                ${r.status==='pending' ? `<button onclick="updateRequestStatus('${r.id}','approved')" class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full btn-press-sm border border-indigo-200 touch-manipulation">対応中</button>` : ''}
                                ${r.status==='approved' ? `<button onclick="updateRequestStatus('${r.id}','done')" class="text-[9px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full btn-press-sm border border-emerald-200 touch-manipulation">完了</button>` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } else {
                reqHtml = '<div class="text-center py-10 text-sm text-gray-400 fade-in">この日の期限に設定された<br>リクエストはありません</div>';
            }
        } else {
            reqHtml = '<div class="text-center py-10 text-sm text-gray-400 fade-in">日付をタップすると<br>その日が期限のリクエストが表示されます</div>';
        }
        
        return `
        <div class="z-10 rounded-b-3xl bg-gradient-to-r from-indigo-600 to-purple-600 px-6 pb-5 pt-10 shadow-md text-white fade-in">
            <button onclick="navigateTo('adminDashboard')" class="mb-2 flex items-center text-xs font-medium opacity-70 btn-press-sm touch-manipulation">← ダッシュボードへ</button>
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold">📅 カレンダー</h1>
                <div class="flex gap-2">
                    <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold btn-press-sm touch-manipulation">◀</button>
                    <button onclick="changeCalendarMonth(1)" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold btn-press-sm touch-manipulation">▶</button>
                </div>
            </div>
            <p class="text-center font-bold mt-2 text-lg tracking-wider">${year}年 ${month + 1}月</p>
        </div>
        <div class="flex-1 overflow-y-auto bg-gray-50 flex flex-col relative">
            <div class="bg-white p-4 shadow-sm border-b border-gray-200 z-10 shrink-0">
                <div class="grid grid-cols-7 text-center text-[10px] font-bold text-gray-500 mb-2">
                    <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
                </div>
                <div class="grid grid-cols-7">
                    ${daysHtml}
                </div>
            </div>
            <div class="p-4 flex-1">
                <h2 class="text-[10px] font-bold text-indigo-700 mb-3 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                    ${state.calendarSelectedDate ? state.calendarSelectedDate.replace(/-/g, '/') + ' 期限のリクエスト' : '選択した日付のリクエスト'}
                </h2>
                ${reqHtml}
            </div>
        </div>`;
    }

    function renderModal() {
        if (!state.modal) return '';
        let inner = '';
        if (state.modal === 'addLot') inner = modalAddLot();
        else if (state.modal === 'newItem') inner = modalNewItem();
        else if (state.modal === 'sendRequest') inner = modalSendRequest();
        else if (state.modal === 'guide') inner = modalGuide();
        else if (state.modal === 'memberDetail') inner = modalMemberDetail();
        else if (state.modal === 'groupDetail') inner = modalGroupDetail();
        else return '';

        return `
        <div class="absolute inset-0 z-50 flex items-end justify-center modal-bg" onclick="closeModalBg(event)">
            <div class="absolute inset-0 bg-black/50"></div>
            <div class="relative w-full max-h-[90%] overflow-y-auto bg-white rounded-t-3xl p-6 pb-[50vh] modal-content shadow-[0_-20px_40px_rgba(0,0,0,0.2)]" onclick="event.stopPropagation()">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
                ${inner}
            </div>
        </div>`;
    }

    function modalGuide() {
        let title = "使い方ガイド";
        let desc = "";
        
        if (state.currentScreen === 'shelterSelect') {
            desc = "<strong>避難所の選択</strong><br>現在あなたが滞在している、またはこれから向かう避難所を一覧から選んでください。";
        } else if (state.currentScreen === 'groupRegister') {
            desc = "<strong>避難メンバーの登録</strong><br>あなたと一緒に避難している家族やグループのメンバーを追加します。<br>乳幼児のおむつや高齢者の常備薬など、一人ひとりに必要な配慮をチェックしてください。<br><br>全て入力したら、画面下部の「この内容で登録・入所する」ボタンを押して完了です。";
        } else if (state.currentScreen === 'userMain') {
            if (state.userTab === 'supplies') {
                desc = "<strong>物資の一覧とリクエスト</strong><br>現在避難所にある物資の在庫状況と、残り日数の目安を確認できます。<br>リストにない物や不足している物があれば、右下の「📩」ボタン、または各物資の詳細から「リクエスト作成」を押して施設管理者に要望を送ることができます。<br>（「その他」カテゴリから独自の物資をリクエストすることも可能です）";
            } else if (state.userTab === 'requests') {

async function removeMember(memberId) {
    if (!currentUserGroup || !currentUserGroup.members) return;

    const target = currentUserGroup.members.find(m => m.id === memberId);
    if (!target) return;

    if (!confirm(`「${target.name}」を削除します。元に戻せません。よろしいですか？`)) return;

    // Supabaseに保存済みのメンバーならDBからも削除
    if (isUuid(memberId)) {
        const { error: memberError } = await db
            .from("members")
            .delete()
            .eq("id", memberId);

        if (memberError) {
            console.error("メンバー削除エラー:", memberError);
            showToast('❌', 'メンバー削除に失敗しました', 'bg-red-500');
            return;
        }
    }

    // 画面上のデータから削除
    currentUserGroup.members = currentUserGroup.members.filter(m => m.id !== memberId);

    // ローカルのリクエスト表示からも対象者情報を整理
    requests = requests.map(r => {
        const hasMemberIds = Array.isArray(r.forMemberIds);
        const isRelated =
            r.forMemberId === memberId ||
            (hasMemberIds && r.forMemberIds.includes(memberId));

        if (!isRelated) return r;

        const ids = hasMemberIds
            ? r.forMemberIds.filter(id => id !== memberId)
            : [];

        const names = ids
            .map(id => currentUserGroup.members.find(m => m.id === id)?.name)
            .filter(Boolean);

        return {
            ...r,
            forMemberIds: ids,
            forMemberId: ids.length > 0 ? ids[0] : null,
            forMemberName: names.length > 0 ? names.join(', ') : null
        };
    });

    if (state.expandedMember === memberId) {
        state.expandedMember = null;
    }

    saveData();
    showToast('🗑', 'メンバーを削除しました', 'bg-red-500');
    render();
}

    async function saveGroupEdits() {
        if (!currentUserGroup || !state.selectedShelter) return;

        const sid = state.selectedShelter.id;

        // UUIDかどうか判定する関数
        function isUuid(value) {
            return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
        }

        for (const m of currentUserGroup.members) {
            // 既にSupabaseにあるメンバーなら update
            if (isUuid(m.id)) {
                const { error } = await db
                    .from("members")
                    .update({
                        name: m.name,
                        type: m.type,
                        special_notes: m.specialNotes || null,
                        disabled: false
                    })
                    .eq("id", m.id);

                if (error) {
                    console.error("メンバー更新エラー:", error);
                    showToast('❌', 'メンバー情報の更新に失敗しました', 'bg-red-500');
                    return;
                }

            // 追加したばかりのメンバーなら insert
            } else {
                const { data, error } = await db
                    .from("members")
                    .insert({
                        group_id: currentUserGroup.id,
                        name: m.name,
                        type: m.type,
                        special_notes: m.specialNotes || null,
                        disabled: false
                    })
                    .select()
                    .single();

                if (error) {
                    console.error("メンバー追加エラー:", error);
                    showToast('❌', '新しいメンバーの保存に失敗しました', 'bg-red-500');
                    return;
                }

                // Supabaseで作られたUUIDに差し替える
                m.id = data.id;
            }
        }

        if (!shelterGroups[sid]) shelterGroups[sid] = [];
        const existing = shelterGroups[sid].findIndex(g => g.id === currentUserGroup.id);

        if (existing >= 0) {
            shelterGroups[sid][existing] = currentUserGroup;
        } else {
            shelterGroups[sid].push(currentUserGroup);
        }

        saveData();

        showToast('✅', 'メンバー情報を保存しました', 'bg-emerald-600');
    }

    async function submitRequest() {
    const d = state.modalData;

    let itemName = d.itemName;
    if (d.itemId === 'custom') {
        const el = document.getElementById('req-custom-name');
        if (el) itemName = el.value.trim();
        if (!itemName) {
            alert('物資名を入力してください');
            return;
        }
    }

    const quantity = parseInt(document.getElementById('req-quantity').value) || 1;
    const deadlineDays = parseInt(document.getElementById('req-deadline').value) || 7;

    const createdDate = new Date();
    const targetDate = new Date(createdDate.getTime());
    targetDate.setDate(targetDate.getDate() + deadlineDays);
    const deadlineDateStr = targetDate.toISOString().split('T')[0];

    const reqNote = document.getElementById('req-note')
        ? document.getElementById('req-note').value.trim()
        : '';

    const cbs = Array.from(document.querySelectorAll('.req-member-cb'));
const checkedCbs = cbs.filter(cb => cb.checked);
const forMemberIds = checkedCbs.map(cb => cb.value);


let forMemberName = null;

    if (currentUserGroup && forMemberIds.length > 0) {
        if (forMemberIds.length === currentUserGroup.members.length) {
            forMemberName = null;
        } else {
            const names = forMemberIds.map(id => {
                const m = currentUserGroup.members.find(x => x.id === id);
                return m ? m.name : '';
            }).filter(n => n);
            forMemberName = names.join(', ');
        }
    }

    const fullNote = [
        reqNote,
        forMemberName ? `対象者: ${forMemberName}` : '',
    ].filter(Boolean).join('\n');

    const { data, error } = await db
        .from("supply_requests")
        .insert({
            shelter_id: state.selectedShelter.id,
            group_id: currentUserGroup ? currentUserGroup.id : null,
            item_id: d.itemId === 'custom' ? null : d.itemId,
            item_name: itemName,
            quantity: quantity,
            deadline_days: deadlineDays,
            deadline_date: deadlineDateStr,
            note: fullNote || null,
            status: 'pending'
        })
        .select()
        .single();

    if (error) {
        console.error("リクエスト送信エラー:", error);
        showToast('❌', 'リクエスト送信に失敗しました', 'bg-red-500');
        return;
    }

    const reqId = data.id;
    function isUuid(value) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
    }

    const validMemberIds = forMemberIds.filter(id => isUuid(id));

    if (validMemberIds.length > 0) {
        const requestMemberRows = validMemberIds.map(memberId => ({
            request_id: reqId,
            member_id: memberId
        }));

        const { error: requestMembersError } = await db
            .from("request_members")
            .insert(requestMemberRows);

        if (requestMembersError) {
            console.error("リクエスト対象者保存エラー:", requestMembersError);
            showToast('❌', 'リクエスト対象者の保存に失敗しました', 'bg-red-500');
            return;
        }
    }

    requests.push({
        id: reqId,
        shelterId: data.shelter_id,
        itemId: data.item_id || d.itemId,
        itemName: data.item_name,
        quantity: data.quantity,
        deadlineDays: data.deadline_days,
        deadlineDate: data.deadline_date,
        status: data.status,
        createdAt: data.created_at,
        groupId: data.group_id,
        forMemberId: forMemberIds.length > 0 ? forMemberIds[0] : null,
        forMemberIds: forMemberIds,
        forMemberName: forMemberName,
        note: reqNote
    });

    if (forMemberIds && forMemberIds.length > 0 && d.sourceNeedId && currentUserGroup) {
        forMemberIds.forEach(id => {
            const m = currentUserGroup.members.find(x => x.id === id);
            if (m) m.requestItems[d.sourceNeedId] = reqId;
        });
    }

    closeModal();
    showToast('📩', 'リクエストを送信しました', 'bg-orange-500');
    }

        let notesHtml = '';
        if (m.specialNotes && m.specialNotes.trim()) {
            notesHtml = `<div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-xs text-yellow-800 whitespace-pre-wrap">${m.specialNotes}</div>`;
        } else {
            notesHtml = `<p class="text-xs text-gray-400">メモはありません</p>`;
        }
        
        return `
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">👤 対象者の詳細</h2>
            <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 btn-press-sm">✕</button>
        </div>
        
        <div class="mb-5 flex items-center gap-4 border-b border-gray-100 pb-4">
            <div class="w-14 h-14 bg-indigo-50 rounded-full flex items-center justify-center text-2xl">${typeInfo.emoji}</div>
            <div>
                <h3 class="text-xl font-black text-gray-800">${m.name}</h3>
                <p class="text-xs font-bold text-indigo-600 mt-0.5">${typeInfo.name}</p>
            </div>
        </div>
        
        <div class="space-y-4">
            <div>
                <h4 class="text-[10px] font-bold text-gray-500 uppercase mb-2 border-l-4 border-emerald-400 pl-2">登録ニーズ・アレルギー等</h4>
                <div class="flex flex-col gap-2">
                    ${needsHtml}
                </div>
            </div>
            
            <div>
                <h4 class="text-[10px] font-bold text-gray-500 uppercase mb-2 border-l-4 border-yellow-400 pl-2">特記事項・メモ</h4>
                ${notesHtml}
            </div>
        </div>
        `;
    }

    function openGroupDetail(shelterId, groupId, targetMemberIdsStr = null) {
        const group = (shelterGroups[shelterId] || []).find(g => g.id === groupId);
        if (!group) return;
        
        let targetMemberIds = targetMemberIdsStr ? targetMemberIdsStr.split(',') : null;
        
        state.modal = 'groupDetail';
        state.modalData = { group, shelterId, targetMemberIds };
        render();
    }

    function modalGroupDetail() {
        const { group, targetMemberIds } = state.modalData;
        
        const filteredMembers = targetMemberIds ? group.members.filter(m => targetMemberIds.includes(m.id)) : group.members;
        
        let membersHtml = filteredMembers.map(m => {
            const typeInfo = memberTypes.find(t => t.id === m.type);
            const nList = needsByType[m.type] || [];
            const activeNeeds = nList.filter(n => !!m.needs[n.id]);
            
            let needsHtml = activeNeeds.map(n => {
                const opt = m.needs[n.id+'Option'] ? ` (${m.needs[n.id+'Option']})` : '';
                return `<span class="inline-block bg-gray-100 text-gray-600 text-[9px] px-1.5 py-0.5 rounded-full mr-1 mb-1">${n.emoji}${n.name}${opt}</span>`;
            }).join('');
            if(!needsHtml) needsHtml = `<span class="text-[9px] text-gray-400">特になし</span>`;
            
            let notes = (m.specialNotes||'').trim() ? `<p class="text-[9px] text-yellow-700 bg-yellow-50 p-1 rounded mt-1">📝 ${m.specialNotes}</p>` : '';
            
            return `
            <div class="flex gap-3 items-start border-b border-gray-100 py-2 last:border-0">
                <div class="text-xl bg-indigo-50 w-8 h-8 rounded-full flex items-center justify-center shrink-0">${typeInfo.emoji}</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold text-gray-800">${m.name} <span class="text-[9px] text-indigo-500 font-normal">(${typeInfo.name})</span></p>
                    <div class="mt-1">${needsHtml}</div>
                    ${notes}
                </div>
            </div>`;
        }).join('');
        
        return `
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">${targetMemberIds ? '👥 対象者の詳細' : '👥 グループ詳細'}</h2>
            <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 btn-press-sm">✕</button>
        </div>
        <div class="space-y-2 mb-4">
            <p class="text-[10px] text-gray-500">このリクエストは${targetMemberIds ? `選択された ${filteredMembers.length} 名` : `グループ全体（${group.members.length}名）`}に向けて作成されました。</p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-2 max-h-[50vh] overflow-y-auto">
            ${membersHtml}
        </div>
        `;
    }

    async function loadSupplyLotsFromSupabase() {
    const { data, error } = await db
        .from("supply_lots")
        .select("*");

    if (error) {
        console.error("在庫読み込みエラー:", error);
        return;
    }

    supplyLots = {};

    data.forEach(lot => {
        const sid = lot.shelter_id;
        const itemId = lot.item_id;

        if (!supplyLots[sid]) supplyLots[sid] = {};
        if (!supplyLots[sid][itemId]) supplyLots[sid][itemId] = [];

        supplyLots[sid][itemId].push({
            id: lot.id,
            servingsPerUnit: lot.servings_per_unit,
            quantity: lot.quantity,
            expirationDate: lot.expiration_date,
            image: lot.image_url,
            addedAt: lot.created_at
        });
    });
}

   async function loadRequestsFromSupabase() {
    const { data: reqData, error } = await db
        .from("supply_requests")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("リクエスト読み込みエラー:", error);
        return;
    }

    const reqIds = reqData.map(r => r.id);

    let requestMemberRows = [];

    if (reqIds.length > 0) {
        const { data: rmData, error: rmError } = await db
            .from("request_members")
            .select("*")
            .in("request_id", reqIds);

        if (rmError) {
            console.error("リクエスト対象者読み込みエラー:", rmError);
            return;
        }

        requestMemberRows = rmData || [];
    }

    function findMemberById(memberId) {
        for (const sid of Object.keys(shelterGroups)) {
            for (const group of shelterGroups[sid]) {
                const member = group.members.find(m => m.id === memberId);
                if (member) return member;
            }
        }
        return null;
    }

    requests = reqData.map(r => {
        const targetRows = requestMemberRows.filter(row => row.request_id === r.id);
        const forMemberIds = targetRows.map(row => row.member_id);

        const names = forMemberIds
            .map(id => {
                const m = findMemberById(id);
                return m ? m.name : "";
            })
            .filter(name => name);

        return {
            id: r.id,
            shelterId: r.shelter_id,
            groupId: r.group_id,
            itemId: r.item_id,
            itemName: r.item_name,
            quantity: r.quantity,
            deadlineDays: r.deadline_days,
            deadlineDate: r.deadline_date,
            note: r.note,
            status: r.status,
            createdAt: r.created_at,
            forMemberIds: forMemberIds,
            forMemberId: forMemberIds.length > 0 ? forMemberIds[0] : null,
            forMemberName: names.length > 0 ? names.join(", ") : null
        };
    });
}

    async function loadGroupsFromSupabase() {
        const { data: groups, error: groupError } = await db
            .from("evac_groups")
            .select("*")
            .order("registered_at", { ascending: true });

        if (groupError) {
            console.error("避難者グループ読み込みエラー:", groupError);
            return;
        }

        const { data: members, error: membersError } = await db
            .from("members")
            .select("*")
            .order("created_at", { ascending: true });

        if (membersError) {
            console.error("メンバー読み込みエラー:", membersError);
            return;
        }

        shelterGroups = {};
        const groupMap = {};

        groups.forEach(g => {
            const groupObj = {
                id: g.id,
                registeredAt: g.registered_at,
                members: []
            };

            if (!shelterGroups[g.shelter_id]) {
                shelterGroups[g.shelter_id] = [];
            }

            shelterGroups[g.shelter_id].push(groupObj);
            groupMap[g.id] = groupObj;
        });

        members.forEach(m => {
            const group = groupMap[m.group_id];
            if (!group) return;

            group.members.push({
                id: m.id,
                type: m.type,
                name: m.name,
                needs: {},
                requestItems: {},
                specialNotes: m.special_notes || '',
                disabled: false
            });
        });
    }

    async function initApp() {
    loadData();
    await loadGroupsFromSupabase();
    await loadSupplyLotsFromSupabase();
    await loadRequestsFromSupabase();
    render();
    }

    initApp();
</script>
